[project]
name = "traffic-safety"
version = "0.1.0"
description = "交通安全路口提醒 App（資料庫課程專題）後端、匯入與 AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "joblib>=1.4",
    "truststore>=0.10.5",
]

[dependency-groups]
dev = [
    "mcp>=2.3.0",
    "pillow>=13.0.0",
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
